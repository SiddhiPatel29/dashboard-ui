<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">C</div>
            </div>

            <nav class="nav">
                <a class="nav-item active" href="#">
                    <i class="fa-regular fa-house"></i>
                    <span>Dashboard</span>
                    <em class="badge-active">Active</em>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span class="item">Analytics</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="item">Sales</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-receipt"></i>
                    <span class="item">Orders</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-user-group"></i>
                    <span class="item">Customers</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-box"></i>
                    <span class="item">Products</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-regular fa-calendar"></i>
                    <span class="item">Calendar</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-regular fa-message"></i>
                    <span class="item">Messages</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-regular fa-folder"></i>
                    <span class="item">Files</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-flag"></i></span>
                    <span class="item">Reports</span>
                </a>
            </nav>
            <div class="nav nav-button">
                <a class="nav-item" href="#">
                    <i class="fa-solid fa-gear"></i>
                    <span class="item">Settings</span>
                </a>

                <a class="nav-item" href="#">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span class="item">Logout</span>
                </a>
            </div>
        </aside>

        <main class="main">
            <header class="header">
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="top-actions">
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <button class="icon-btn"><i class="fa-regular fa-message"></i></button>
                    <button class="icon-btn"><i class="fa-regular fa-calendar"></i></button>
                    <label for="" class="toggle">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="profile">
                    <span class="profile-icon"><i class="fa-regular fa-circle-user"></i></span>
                    <div class="profile-text">
                        <p class="name">Alex</p>
                        <p class="role">Administrator</p>
                    </div>
                </div>
            </header>
        </main>

    </div>

</body>

</html>
